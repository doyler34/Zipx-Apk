name: Build APK

# Builds a release APK and publishes it to a GitHub Release so it can be
# sideloaded (e.g. via the Downloader app) from a public URL.
#
# Builds automatically on every push to main, and can also be run manually
# from the "Actions" tab or by pushing a tag like v1.0.0. Either way the APK
# ends up attached to the "latest" release at a stable URL:
#   https://github.com/doyler34/zipx-apk/releases/download/latest/zipx-movies.apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project builds against - newer Flutter
          # breaks the pinned flex_color_scheme/carousel_slider deps.
          flutter-version: '3.22.3'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Regenerate the launcher icon + splash screen from the source images in
      # assets/ (config lives in pubspec.yaml), so updating those images is all
      # that's needed to change them.
      - name: Generate launcher icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      # Decrypt the committed release keystore (android/app/keystore.enc) and
      # write key.properties, so the APK is signed with a stable key (updates
      # install over the top instead of needing an uninstall).
      #
      # Only ONE secret is required:
      #   KEYSTORE_PASSWORD  - unlocks both the AES-encrypted keystore file
      #                        and the keystore itself (same value).
      # The key alias is not secret, so it's set inline below.
      - name: Set up release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Decrypt the keystore committed in the repo.
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -in android/app/keystore.enc \
            -out android/app/upload-keystore.p12 \
            -pass pass:"$KEYSTORE_PASSWORD" || {
              echo "::error::Could not decrypt the keystore - KEYSTORE_PASSWORD is wrong."
              exit 1
            }
          # Verify the keystore opens with that password before building.
          if ! keytool -list -keystore android/app/upload-keystore.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore decrypted but the password did not open it. Re-check KEYSTORE_PASSWORD."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=zipx
          storeFile=upload-keystore.p12
          EOF

      # Auto-bump the version on every build so each APK is recognized as
      # newer than the last. versionCode = the CI run number (monotonically
      # increasing); versionName = 1.0.<run number>.
      # The TMDB key is a built-in default in source (UserSettings), so no
      # build-time secret is required for it.
      # Retry up to 3 times: media_kit's native libs are pulled from GitHub
      # release assets at gradle-configure time, and that CDN occasionally
      # returns a transient 503 - which is a flaky download, not a real build
      # failure. Re-running the build re-attempts the download.
      - name: Build release APK
        run: |
          build() {
            flutter build apk --release \
              --build-number=${{ github.run_number }} \
              --build-name=1.0.${{ github.run_number }} \
              --dart-define=AIOSTREAMS_ADDON_URL=${{ secrets.AIOSTREAMS_ADDON_URL }} \
              --dart-define=PREPARE_ADDON_URL=${{ secrets.PREPARE_ADDON_URL }} \
              --dart-define=PREPARE_API_KEY=${{ secrets.PREPARE_API_KEY }}
          }
          for n in 1 2 3; do
            if build; then exit 0; fi
            echo "::warning::APK build attempt $n failed (often a transient media_kit dependency download). Retrying in $((n*20))s..."
            sleep $((n*20))
          done
          echo "::error::APK build failed after 3 attempts."
          exit 1

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk zipx-movies.apk

      # Stable "latest" release, updated in place on every build so the
      # Downloader URL never changes.
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: zipx-movies.apk
          fail_on_unmatched_files: true

      # Also attach to the version tag's own release when triggered by a tag.
      - name: Publish to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zipx-movies.apk
          fail_on_unmatched_files: true
