name: Build APK

# Builds a release APK and publishes it to a GitHub Release so it can be
# sideloaded (e.g. via the Downloader app) from a public URL.
#
# Trigger it manually from the GitHub "Actions" tab (Run workflow), or by
# pushing a tag like v1.0.0. Either way the APK ends up attached to the
# "latest" release at a stable URL:
#   https://github.com/doyler34/zipx-apk/releases/download/latest/zipx-movies.apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project builds against - newer Flutter
          # breaks the pinned flex_color_scheme/carousel_slider deps.
          flutter-version: '3.22.3'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Decrypt the committed release keystore (android/app/keystore.enc) and
      # write key.properties, so the APK is signed with a stable key (updates
      # install over the top instead of needing an uninstall).
      #
      # Only ONE secret is required:
      #   KEYSTORE_PASSWORD  - unlocks both the AES-encrypted keystore file
      #                        and the keystore itself (same value).
      # The key alias is not secret, so it's set inline below.
      - name: Set up release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Decrypt the keystore committed in the repo.
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -in android/app/keystore.enc \
            -out android/app/upload-keystore.p12 \
            -pass pass:"$KEYSTORE_PASSWORD" || {
              echo "::error::Could not decrypt the keystore - KEYSTORE_PASSWORD is wrong."
              exit 1
            }
          # Verify the keystore opens with that password before building.
          if ! keytool -list -keystore android/app/upload-keystore.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore decrypted but the password did not open it. Re-check KEYSTORE_PASSWORD."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=zipx
          storeFile=upload-keystore.p12
          EOF

      # Auto-bump the version on every build so each APK is recognized as
      # newer than the last. versionCode = the CI run number (monotonically
      # increasing); versionName = 1.0.<run number>.
      # The TMDB key is baked into the app as a built-in default in source
      # (see UserSettings._buildTimeApiKey), so no build-time secret is
      # needed. A key the user enters in Settings still overrides it.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk zipx-movies.apk

      # Stable "latest" release, updated in place on every build so the
      # Downloader URL never changes.
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: zipx-movies.apk
          fail_on_unmatched_files: true

      # Also attach to the version tag's own release when triggered by a tag.
      - name: Publish to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zipx-movies.apk
          fail_on_unmatched_files: true
