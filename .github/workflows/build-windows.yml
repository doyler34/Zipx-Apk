name: Build Windows

# Builds a Windows desktop build of the app and publishes it as a zip to a
# GitHub Release. The windows/ runner project isn't committed - it's scaffolded
# here with `flutter create` so it always matches the pinned Flutter version.
#
# Native Real-Debrid streaming (media_kit) works on Windows. The VidSrc WebView
# fallback is Phase 2 (needs a WebView2-based plugin instead of webview_flutter).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # Pinned to windows-2022 (VS 2022 C++ toolchain). windows-latest dropped the
    # Visual Studio version Flutter 3.22.3 asks CMake for, breaking the build.
    runs-on: windows-2022
    # Mapped up here so the VPS-upload step can be conditionally skipped when the
    # secrets aren't set (secrets can't be referenced directly in `if:`).
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Generate the windows/ runner project for this app (not committed).
      # --project-name is required: the checkout folder ("Zipx-Apk") isn't a
      # valid Dart package name, so use the pubspec name instead.
      - name: Scaffold Windows project
        run: flutter create --platforms=windows --project-name movie_bloc_app .

      # Convert the ZipX app icon (PNG) to a multi-size .ico and drop it in as
      # the Windows runner icon, so the built exe carries the ZipX icon (not the
      # default Flutter one). ImageMagick ships on the hosted windows image.
      - name: Brand the app icon
        shell: pwsh
        run: |
          magick "assets/logos/app_icon.png" -background none -define icon:auto-resize=256,128,96,64,48,32,16 "zipx.ico"
          Copy-Item "zipx.ico" "windows/runner/resources/app_icon.ico" -Force

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define=AIOSTREAMS_ADDON_URL=${{ secrets.AIOSTREAMS_ADDON_URL }} --dart-define=PREPARE_ADDON_URL=${{ secrets.PREPARE_ADDON_URL }} --dart-define=PREPARE_API_KEY=${{ secrets.PREPARE_API_KEY }}

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (!(Test-Path $out)) { $out = "build/windows/runner/Release" }
          $src = (Resolve-Path $out).Path
          $icon = (Resolve-Path "zipx.ico").Path
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & "$iscc" "/DMyAppVersion=1.0.${{ github.run_number }}" "/DSourceDir=$src" "/DMyAppIcon=$icon" "/O$($PWD.Path)" "installer\zipx.iss"
          if (!(Test-Path "ZipX-Setup.exe")) { Write-Error "Installer not produced"; exit 1 }

      # Upload the installer to your VPS so it can be served from your own
      # IP/domain - no github.com link in the download URL. Uses the runner's
      # native OpenSSH scp (Docker-based upload actions can't run on Windows
      # runners). Skipped until the VPS_* secrets are configured.
      - name: Upload installer to VPS
        if: env.VPS_HOST != ''
        shell: pwsh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DOWNLOAD_DIR: ${{ secrets.VPS_DOWNLOAD_DIR }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "vps_key"
          $key = $env:VPS_SSH_KEY
          if (-not $key.EndsWith("`n")) { $key += "`n" }
          [System.IO.File]::WriteAllText($keyPath, $key)
          # Lock the key down to just this user, or ssh refuses to use it.
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null
          $port = if ($env:VPS_PORT) { $env:VPS_PORT } else { "22" }
          # Retry: the runner->VPS SSH connection occasionally times out (a
          # transient network hiccup), so don't fail the whole build on one miss.
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -P $port -i $keyPath "ZipX-Setup.exe" "$($env:VPS_USER)@$($env:VPS_HOST):$($env:VPS_DOWNLOAD_DIR)/"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::scp attempt $i failed (exit $LASTEXITCODE). Retrying in $($i * 15)s..."
            Start-Sleep -Seconds ($i * 15)
          }
          if (-not $ok) { Write-Error "scp upload failed after 4 attempts"; exit 1 }
          # Best-effort cleanup - the runner temp is wiped after the job anyway,
          # so never let a failed delete fail the build (the key file is locked
          # to read-only for ssh, which can make Remove-Item "access denied").
          Remove-Item $keyPath -Force -ErrorAction SilentlyContinue

      - name: Publish to "latest-windows" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: Latest Windows build
          files: ZipX-Setup.exe
          fail_on_unmatched_files: true
